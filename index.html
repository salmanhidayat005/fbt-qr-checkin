<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FBT Gate Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
  :root { --bg:#f4f3fb; --ink:#1f1b3a; --brand:#5b4fa3; }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif; background:var(--bg); color:var(--ink); }
  header { background:var(--brand); color:#fff; padding:14px 16px; }
  header h1 { margin:0; font-size:18px; }
  header .stats { font-size:14px; opacity:.9; margin-top:4px; }
  main { max-width:480px; margin:0 auto; padding:12px 16px 32px; }
  #reader { width:100%; border-radius:12px; overflow:hidden; background:#000; }
  .manual { display:flex; gap:8px; margin:12px 0; }
  .manual input { flex:1; padding:12px; border:1px solid #c9c5e6; border-radius:10px; font-size:16px; }
  .manual button { padding:12px 16px; border:0; border-radius:10px; background:var(--brand); color:#fff; font-size:16px; }
  #result { border-radius:14px; padding:18px; margin-top:8px; display:none; color:#fff; }
  #result.ok { background:#1f9d55; }
  #result.already { background:#e08a00; }
  #result.bad { background:#d13a3a; }
  #result .status { font-size:22px; font-weight:700; margin-bottom:8px; }
  #result .name { font-size:26px; font-weight:700; }
  #result .type { display:inline-block; margin:8px 0; padding:4px 12px; border-radius:999px; background:rgba(255,255,255,.25); font-weight:700; }
  #result .line { font-size:15px; opacity:.95; margin-top:2px; }
</style>
</head>
<body>
<header>
  <h1>FBT Freshers Party 2026 - Gate Scanner</h1>
  <div class="stats" id="stats">Loading...</div>
</header>
<main>
  <div id="reader"></div>
  <div class="manual">
    <input id="manualId" placeholder="Pass ID manually, e.g. FBT-FP-101" autocapitalize="characters">
    <button onclick="submitManual()">Check</button>
  </div>
  <div id="result"></div>
</main>

<script>
  // ====== SIRF YE 2 LINES BADLNI HAIN ======
  const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwX7e0U5bs-JBlqxqFqxg-A3vRBz74exHRZ0eZFaO4y9GQwbsDjlVVokYyf-sXSkoUsGw/exec';   // Apps Script Deploy ke baad wala /exec link
  const KEY = 'FBT2026';                               // Code.gs wala same KEY
  // =========================================

  let busy = false;
  let lastCode = '', lastTime = 0;

  async function api(params) {
    const url = SCRIPT_URL + '?key=' + encodeURIComponent(KEY) + '&' + new URLSearchParams(params).toString();
    const res = await fetch(url);
    return res.json();
  }

  async function refreshStats() {
    try {
      const s = await api({ action: 'stats' });
      if (s.result === 'ok') {
        document.getElementById('stats').textContent =
          'Checked in: ' + s.checked + ' / ' + s.total + '  |  Remaining: ' + (s.total - s.checked);
      }
    } catch (e) { document.getElementById('stats').textContent = 'Offline / link check karein'; }
  }

  function show(cls, html) {
    const box = document.getElementById('result');
    box.className = cls;
    box.innerHTML = html;
    box.style.display = 'block';
  }

  function beep(ok) {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const o = ctx.createOscillator(); o.connect(ctx.destination);
      o.frequency.value = ok ? 880 : 300; o.start(); o.stop(ctx.currentTime + 0.15);
    } catch (e) {}
    if (navigator.vibrate) navigator.vibrate(ok ? 80 : [120, 60, 120]);
  }

  async function handle(code) {
    if (busy) return;
    const now = Date.now();
    if (code === lastCode && now - lastTime < 4000) return; // same QR dobara foran scan na ho
    lastCode = code; lastTime = now; busy = true;
    show('already', '<div class="status">Checking...</div>');
    try {
      const r = await api({ action: 'checkin', id: code });
      if (r.result === 'ok') {
        beep(true);
        show('ok', card('CHECKED IN', r));
        refreshStats();
      } else if (r.result === 'already') {
        beep(false);
        show('already', card('ALREADY CHECKED IN', r));
      } else if (r.result === 'notfound') {
        beep(false);
        show('bad', '<div class="status">NOT FOUND</div><div class="line">Pass ID: ' + esc(r.id) + '</div>');
      } else {
        beep(false);
        show('bad', '<div class="status">ERROR</div><div class="line">' + esc(r.message || '') + '</div>');
      }
    } catch (e) {
      beep(false);
      show('bad', '<div class="status">NETWORK ERROR</div><div class="line">Internet ya link check karein</div>');
    }
    busy = false;
  }

  function card(title, r) {
    return '<div class="status">' + title + '</div>' +
      '<div class="name">' + esc(r.name) + '</div>' +
      '<div class="type">' + esc(r.type) + '</div>' +
      '<div class="line">Pass ID: ' + esc(r.id) + '</div>' +
      '<div class="line">' + esc(r.dept) + '</div>' +
      '<div class="line">Contact: ' + esc(r.contact) + '</div>' +
      '<div class="line">Time: ' + esc(r.time) + '</div>';
  }

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  }

  function submitManual() {
    const v = document.getElementById('manualId').value.trim();
    if (v) { lastCode = ''; handle(v); document.getElementById('manualId').value = ''; }
  }

  const scanner = new Html5Qrcode('reader');
  scanner.start(
    { facingMode: 'environment' },
    { fps: 10, qrbox: { width: 240, height: 240 } },
    text => handle(text),
    () => {}
  ).catch(err => show('bad', '<div class="status">Camera nahi khula</div><div class="line">Browser mein camera permission allow karein (HTTPS link zaroori hai).</div>'));

  refreshStats();
  setInterval(refreshStats, 15000);
</script>
</body>
</html>
